name: Work poster frames

# On demand: pulls every motion piece without a poster from Blob, extracts a
# frame, commits the JPEGs to assets/work/. Public URLs only — no token needed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: node scripts/work-thumbs.mjs
      - name: Commit posters
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/work
          git diff --cached --quiet || (git commit -m "Work: poster frames" && git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME})
