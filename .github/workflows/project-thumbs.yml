name: Project thumbnails

# On demand: builds the uniform 16:10 project thumbnails listed in
# scripts/project-thumbs.json into assets/projects/ and commits them.
on:
  workflow_dispatch:
    inputs:
      only:
        description: Comma-separated project ids to rebuild (blank = all)
        default: ""

permissions:
  contents: write

jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick ffmpeg >/dev/null
      - run: python3 scripts/project-thumbs.py
        env:
          ONLY: ${{ github.event.inputs.only }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/projects
          git diff --cached --quiet || (git commit -m "Project thumbnails" && git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME})
